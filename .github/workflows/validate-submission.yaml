name: Hub Submission Validation (R)

on:
  pull_request:
    branches: main
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - 'hub-config/validations.yml'
      - 'src/validations/**'
      - '.github/workflows/validate-submission.yaml'
      - '.github/workflows/validate-submission-comment.yaml'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage the hub for validation
        env:
          STAGED_HUB: ${{ runner.temp }}/submission-validation-hub
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          destination = Path(os.environ["STAGED_HUB"])
          destination.mkdir()
          for directory in ("hub-config", "model-output", "model-metadata",
                            "auxiliary-data", "target-data", "src"):
              if Path(directory).is_dir():
                  shutil.copytree(directory, destination / directory)
          PY

      - uses: hubverse-org/hubverse-actions/validate-submission@v2
        env:
          FORECAST_SOURCE_HUB: ${{ github.workspace }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          hub_path: ${{ runner.temp }}/submission-validation-hub
          summary: true
          skip_submit_window_check: false
          extra_packages: |
            any::jsonlite
