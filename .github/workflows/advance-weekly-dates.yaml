name: Propose the next set of `reference_date` and `target_end_date`

on:
  schedule:
    # saturdays at 08:00 Africa/Kinshasa (UTC+1) (equivalent to 3am on the east coast)
    - cron: '0 8 * * 6'
      timezone: Africa/Kinshasa
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# scheduled and manual runs share one PR branch; no races
concurrency:
  group: propose-weekly-forecast-dates
  cancel-in-progress: false

jobs:
  propose-dates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Append next dates
        id: dates
        run: python3 src/advance-weekly-dates.py

      # Full hub validation runs on this PR via validate-config.yaml.
      - name: PR for human review
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WEEKLY_DATE_ADVANCE_PAT }}
          base: main
          branch: auto/weekly-date-advance
          add-paths: hub-config/tasks.json
          commit-message: 'Add next weekly reference and target end dates'
          title: 'Advance weekly dates for `${{ steps.dates.outputs.reference_date }}`'
          body: |
            Add `${{ steps.dates.outputs.reference_date }}` as the next `reference_date` for both weekly targets.

            - `wk inc confirmed cases` target end date: `${{ steps.dates.outputs.target_end_date }}`
            - `wk R_t` target end date: `${{ steps.dates.outputs.rt_target_end_date }}` (horizon 0)

            Full hub configuration validation runs on this PR. Review and merge only after it passes.
