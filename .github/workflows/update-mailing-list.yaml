name: Update contributor mailing list

on:
  push:
    branches: [main]
    paths:
      - 'model-metadata/*.yml'
      - 'model-metadata/*.yaml'
      - 'src/update-mailing-list.R'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mailing-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::yaml

      - name: Regenerate auxiliary-data/mailing-list.txt
        run: Rscript src/update-mailing-list.R

      - name: Open a pull request if the list changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: auto/update-mailing-list
          add-paths: auxiliary-data/mailing-list.txt
          commit-message: 'Update contributor mailing list'
          title: 'Update contributor mailing list'
          body: |
            New contributor email addresses were found in `model-metadata/` and
            added to `auxiliary-data/mailing-list.txt`. Review the diff, then merge.

            Generated by `src/update-mailing-list.R`. No PR is opened when the
            list is unchanged.
