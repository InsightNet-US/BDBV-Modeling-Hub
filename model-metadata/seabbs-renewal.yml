model_details:
  data_inputs: Hub target data (weekly confirmed cases by onset week, observed plus imputed, for the country, provinces and health zones), the hub's published onset-to-report delays by vintage, province populations and population-weighted province centres. The generation interval is BVDOutbreakSize's. The newest BVDOutbreakSize release published by the forecast's cut-off, for its Rt estimates.
  methods: A renewal model per health zone with pooled Rt, importation and depletion, with Rt tied to the newest BVDOutbreakSize estimates with their SDs inflated. Provinces are zone sums.
  methods_long: 'We model infections in each health zone with recent cases with a renewal process in PyRenew. Log Rt is a national weekly AR(1) plus partially pooled province and zone deviations. Infections move between zones through a gravity kernel, and susceptibles are depleted. Zones with no recent case are not fitted: they take infections only through the fitted importation from the fitted zones. The model''s national, province and zone Rt in the week of the newest BVDOutbreakSize release published by the cut-off are tied to that release''s Rt estimates by a likelihood term with their SDs inflated by 1.5. Health zones are fitted. Each province is the sum of its zones and national is the sum of the provinces, sample by sample. Zone WorldPop populations and the centroids of each zone''s largest polygon set the importation kernel between zones. Rt is dated by infection. Onsets are infections convolved with a log-normal incubation period, with BVDOutbreakSize''s priors on its mean and SD.
    A time-varying share of onsets is confirmed. The onset-to-report delay is a discrete hazard, smooth over delay, with a national weekly shift and province offsets and drifts pooled towards it. Known onsets are right truncated by this delay and by a 0 to 7 day report-to-publication lag learnt from consecutive releases. The share of reports with no onset date is modelled by province. The hub''s imputed onsets are modelled as the hub makes them: cases with no onset date, back-sampled from report day with the hub''s delay. Weekly known and imputed counts are negative binomial, and the delays of known onsets are Dirichlet-multinomial. Log Rt reverts towards Rt = 1 with a fitted half-life, in the fit and the forecast weeks alike. The model is fitted by NUTS (NumPyro) to each data release, and each sample is one joint posterior trajectory. See https://samabbott.co.uk/bdbv-hub-modelling/methods/model/. We also provide the wk R_t target. It is the model''s weekly effective reproduction number
    (Rt times the susceptible share), indexed to the week of infection, for each health zone the model fits, each province and the country. A province or the country weights its zones'' Rt by their infections. The generation interval and incubation period come from BVDOutbreakSize, with their uncertainty, and the quantiles carry the full posterior uncertainty. Please read it with two points in mind. First, it is estimated from the hub target data (confirmed cases by symptom onset, including the hub''s imputed onsets). Because of how onsets are imputed (https://github.com/InsightNet-US/BDBV-Modeling-Hub/issues/61), it is likely to react more slowly than transmission and to be out of phase with the outbreak. Second, because this target is collected as quantiles, the submission gives each week and location''s distribution on its own. The joint Rt trajectories behind them, with their dependence across weeks and locations, cannot be represented, and quantiles joined across weeks or locations
    do not describe a trajectory. For an Rt estimate less affected by these issues, please see the BVDOutbreakSize summary (https://epiforecasts.io/BVDOutbreakSize/stable/).'
