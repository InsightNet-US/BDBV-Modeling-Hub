model_details:
  data_inputs: "No observed data. All counts are artificial values generated for submission-validation testing."
  methods: "Deterministic synthetic counts for 100 sample trajectories across four weeks, used only to test submission validation."
  methods_long: >-
    This fictional model supplies synthetic data for testing the BDBV Modeling
    Hub submission and append-validation workflow. It does not produce actual
    epidemiological forecasts and is not associated with any contributing model
    team. For sample index s from 1 through 100 and zero-based week index w
    from 0 through 3, the count is 80 + (s modulo 21) + 5*w. Each sample covers
    the weeks ending 2026-10-31, 2026-11-07, 2026-11-14 and 2026-11-21 for
    location CD and target wk inc confirmed cases. The initial submission has
    reference_date 2026-11-07 and forecast_date 2026-11-01. Subsequent test
    submissions may append new complete trajectories under a distinct
    forecast_date while retaining every accepted row unchanged.
