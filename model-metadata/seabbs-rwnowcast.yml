model_details:
  data_inputs: Hub daily onsets by release (observed plus imputed) for provinces and health zones, and the hub's weekly target data.
  methods: A chain-ladder nowcast of each place's recent weeks from the daily release snapshots (baselinenowcast), carried forward as a log-scale random walk. National is the province sum.
  methods_long: We nowcast and forecast weekly confirmed cases by onset week for each health zone and province. The nowcast is the baselinenowcast method (Johnson et al. 2025, Wellcome Open Research, doi:10.12688/wellcomeopenres.25027.2), from a JAX port of baselinenowcast 0.2.2. A chain ladder on the hub's daily release snapshots fits one daily reporting delay to every release pair in a 42-day window, by non-negative least squares on the log scale. Report days no release observes are skipped, and downward revisions are moved onto earlier releases. Daily nowcasts are summed to hub weeks. The cases still to be reported are negative binomial, with a dispersion fitted per horizon from retrospective nowcasts. Each nowcast draw is carried forward from its latest week as a random walk on the log scale with Poisson noise. A place with fewer than 10 cases a week uses the delay, dispersion and walk spread pooled over its parent (zone, then province, then country). Within each week the provinces'
    draws are paired by a Gaussian copula whose correlation is estimated from the model's own past errors (Schaake shuffle), so each province keeps its draws. The national value is the sum of the provinces. See https://samabbott.co.uk/bdbv-hub-modelling/methods/baselines/.
