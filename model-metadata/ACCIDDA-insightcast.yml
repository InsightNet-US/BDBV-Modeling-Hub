model_details:
  data_inputs: "Hub target data (weekly confirmed cases by week of symptom onset, release available at the submission deadline) and the hub's case-level onset-to-report delays by province."
  methods: "Delay-, revision- and trend-based nowcast of recent onset weeks, then a per-location pool of the 5 insight.cast models with the lowest rolling-origin WIS, with extreme and tail trajectories trimmed."
  methods_long: "Recent onset weeks are nowcast from the hub's onset-to-report delays: the delay distribution is estimated from fully observed onset weeks (by province where there are at least 300 cases, nationally otherwise), shifted by a 2-day release lag, and used to compute each week's expected share of cases already reported. Because counts keep rising for several weeks beyond what the delays imply, that share is multiplied by a revision factor for the week's age, learned from consecutive recent releases, with a province-specific factor for the newest week; each draw also varies the share by as much as single weeks' catch-up has varied. Weeks less than 85% reported get a gamma prior from a log-linear trend fitted to the last six well-reported weeks, coupled to the reported count through the binomial reporting model, so a low first report is read partly as slow reporting and partly as a real fall; other weeks get a weak prior centred on the previous four weeks' level. Unreported cases are drawn from the resulting negative binomial; a location whose last three or more weeks have no reported case stays at zero in those weeks. For each location with at least one confirmed case so far (the country, provinces and health zones), insight.cast candidate models (ETS and ARIMA variants, neural network autoregression and pretrained time-series foundation models Chronos, TimesFM and Sundial) are fit to the nowcast-corrected weekly series, scored by weighted interval score on 4-week-ahead forecasts at 6 rolling weekly origins ending 3 weeks before the latest data, and the five lowest-scoring models are pooled with equal weights. Forecast uncertainty from the nowcast is carried by refitting on its 25th and 75th percentiles and pooling. Negative forecast values are clipped at zero. The pool is then trimmed on 1,000 trajectories per model: any trajectory reaching 10 times the largest nowcast median of the last 4 weeks in a forecast week is dropped, then the 5% with the highest and the 5% with the lowest totals over the forecast weeks. The same limit applies across the submitted nowcast weeks, unless a week's median is already at or above it. Submissions cover nowcasts of the five onset weeks before the reference week and forecasts of the reference week and the three following weeks. Each sample trajectory runs through all nine weeks: each week's value is drawn from its nowcast or pooled forecast distribution, linked across weeks by a Gaussian copula with week-to-week correlation 0.9."
ensemble_of_hub_models: false
