model_details:
  data_inputs: "Number of new cases (alive and dead), deaths (in the CTE and in the community), hospitalized, recovered (from hospitals), from INSP situation reports."
  methods: "Deterministic SEIHRD type model fit using a Sequential Monte Carlo approach"
  methods_long: "Deterministic SEIHRD type model with Susceptible, Exposed, Infectious (undetected), Infectious (detected), Recovered (community, not detected before recovery), Dead (community, not detected before death), Recovered (community), Dead (community), Hospitalized, Recovered (from the Hospital), Dead (in the Hospital). Model fit using a Sequential Monte Carlo approach, with Negative Binomial distributions on observations."
