  methods_long: "Deterministic SEIHRD type model with Susceptible, Exposed, Infectious (undetected), Infectious (detected), Recovered (community, not detected before recovery), Dead (community, not detected before death), Recovered (community), Dead (community), Hospitalized, Recovered (from the Hospital), Dead (in the Hospital). Model fit using Sequential Monte Carlo approach, with Negative Binomials on observations."
