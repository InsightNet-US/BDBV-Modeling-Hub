model_details:
  data_inputs: "Cumulative confirmed cases in the DRC INSP situation reports (31 July to 24 October 2026); symptomatic cases exported to Uganda (WHO situation reports and Disease Outbreak News); early case counts in Beni (North Kivu); daily commuting and IATA/OAG air-travel flows. The hub target data are used only as a check, not for calibration."
  methods: "Stochastic GLEAM metapopulation SEIHFR model with overdispersed transmission and isolation scenarios, calibrated by two-stage ABC to exported cases and DRC situation-report totals."
  methods_long: "Stochastic, discrete-time metapopulation model of Bundibugyo virus disease on the road-GLEAM basin network (Balcan et al. 2010, J Comput Sci), with daily commuting and air travel between basins. Within each basin a Legrand-type SEIHFR model (Legrand et al. 2007; Gomes et al. 2014) with community, hospital and funeral transmission and a care pathway (community, health-care facility and isolation branches) informed by Ajelli et al. 2025. Individual heterogeneity in transmission uses four transmissibility classes (a 4-class discretisation of overdispersion k = 0.1; 57 % of cases transmit to no one). Five index cases are placed in Bunia (Ituri) on a sampled start date. Stage 1, rejection ABC on simulations to 24 May 2026: priors R0 ~ U(1.2, 4.0), mean incubation period ~ U(5, 10) days, start date ~ U(17 January, 15 March 2026); evidence is 2 to 4 symptomatic onsets in Uganda between 15 and 23 May and/or 2 to 80 cumulative onsets in Beni by 24 May (three chains, 60,759 accepted draws). Forward scenarios: every accepted draw is replayed to 31 December under five caps on the share of cases routed to isolation (30, 40, 50, 60 and 75 %). Isolation ramps up in Bunia from 20 May at 1 percentage point per day, and in other basins from the day they reach 80 cumulative onsets (1 point per day, 0.5 in Beni). Stage 2, ABC: confirmed cases = c x isolated symptomatic onsets, with c ~ U(1, 1/cap), mapped to report dates by a gamma onset-to-report delay (mean 5 days, SD 3.5 days). Accepted (trajectory, c) pairs reproduce the increments of cumulative confirmed cases in the DRC situation reports since 31 July (10 data points to 24 October) with a mean absolute percentage error of at most 5 %. The five isolation scenarios are pooled with equal prior weight, so each scenario enters with its share of accepted pairs. Forecast: 100 accepted pairs are drawn by systematic sampling; weekly confirmed cases by onset week are Poisson(c x isolated onsets in that week), i.e. final counts by onset date, with no reporting delay. National level (CD) only."
model_version: "v2"
website_url: "https://epistorm.github.io/EBV2026/"
repo_url: "https://github.com/epistorm/EBV2026"
citation: "Ajelli M, Muyembe J-J, Touré A, Diallo A, Litvinova M, Merler S, et al. Vaccination strategies for Ebola in the Democratic Republic of Congo: the WHO-Ebola modeling collaboration. Int J Infect Dis. 2025;153:107779. https://doi.org/10.1016/j.ijid.2025.107779"
ensemble_of_hub_models: false
