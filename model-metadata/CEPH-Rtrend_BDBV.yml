model_details:
  data_inputs: "Daily incident Bundibugyo hospitalizations and reported delay"
  methods: "A renewal equation method based on Bayesian estimation of Rt from hospitalization data."
  methods_long: "Model forecasts are obtained by using a renewal equation based on the estimated net reproduction number
   Rt. We then estimate the posterior distribution of Rt. The estimated Rt in the last weeks of considered data is 
   used to forecast Rt in the upcoming weeks. Finally, we use the renewal equation with the 
   posterior distribution and trend of the estimated Rt."
